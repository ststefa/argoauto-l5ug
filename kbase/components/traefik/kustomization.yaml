apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: traefik

helmCharts:
  #! See https://github.com/traefik/traefik-helm-chart/releases
  - name: traefik
    includeCRDs: true
    version: 42.1.3
    repo: https://traefik.github.io/charts
    releaseName: traefik
    valuesFile: traefik-values.yaml
    namespace: traefik

resources:
  - traefik-ns.yaml
  #! Manually managed and kustomizable dashboard ingress
  - traefik-ingressroute.yaml
