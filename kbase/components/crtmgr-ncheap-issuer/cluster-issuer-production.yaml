apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-namecheap-production
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@nom.cx
    privateKeySecretRef:
      name: letsencrypt-namecheap-production
    solvers:
      - dns01:
          webhook:
            groupName: acme.namecheap.com
            solverName: namecheap
            config:
              apiKeySecretRef:
                name: namecheap-credentials
                key: apiKey
              apiUserSecretRef:
                name: namecheap-credentials
                key: apiUser
