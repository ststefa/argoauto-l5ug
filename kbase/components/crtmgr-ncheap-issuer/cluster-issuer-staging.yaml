apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-namecheap-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: admin@nom.cx
    privateKeySecretRef:
      name: letsencrypt-namecheap-staging
    solvers:
      - dns01:
          webhook:
            groupName: acme.namecheap.com
            solverName: namecheap
            config:
              apiKeySecretRef:
                name: namecheap-credentials
                key: apiKey
              apiUserSecretRef:
                name: namecheap-credentials
                key: apiUser
        # nom.cx uses split-horizon DNS: wait for public DNS propagation instead of checking the internal DNS view.
        waitInsteadOfSelfCheck: 60s
