#! Collection of useful readonly permissions without affecting security too much
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: power-readonly
rules:

# Core API
- apiGroups: [""]
  resources:
    - pods
    - pods/log
    - services
    - endpoints
    - configmaps
    - namespaces
    - events
    - persistentvolumeclaims
    - persistentvolumes
    - resourcequotas
    - limitranges
    - serviceaccounts
  verbs: ["get", "list", "watch"]

# Apps
- apiGroups: ["apps"]
  resources:
    - deployments
    - statefulsets
    - daemonsets
    - replicasets
  verbs: ["get", "list", "watch"]

# Batch
- apiGroups: ["batch"]
  resources:
    - jobs
    - cronjobs
  verbs: ["get", "list", "watch"]

# Networking
- apiGroups: ["networking.k8s.io"]
  resources:
    - ingresses
    - networkpolicies
  verbs: ["get", "list", "watch"]

# Storage
- apiGroups: ["storage.k8s.io"]
  resources:
    - storageclasses
    - csidrivers
    - csinodes
    - volumeattachments
  verbs: ["get", "list", "watch"]

# Autoscaling
- apiGroups: ["autoscaling"]
  resources:
    - horizontalpodautoscalers
  verbs: ["get", "list", "watch"]

# Policy
- apiGroups: ["policy"]
  resources:
    - poddisruptionbudgets
  verbs: ["get", "list", "watch"]

# Discovery / Extension APIs
- apiGroups: ["apiextensions.k8s.io"]
  resources:
    - customresourcedefinitions
  verbs: ["get", "list", "watch"]

- apiGroups: ["apiregistration.k8s.io"]
  resources:
    - apiservices
  verbs: ["get", "list", "watch"]

# Metrics
- apiGroups: ["metrics.k8s.io"]
  resources:
    - pods
    - nodes
  verbs: ["get", "list", "watch"]

# RBAC read-only
- apiGroups: ["rbac.authorization.k8s.io"]
  resources:
    - roles
    - rolebindings
    - clusterroles
    - clusterrolebindings
  verbs: ["get", "list", "watch"]

# Optional debugging
- apiGroups: [""]
  resources:
    - pods/portforward
  verbs:
    - get
    - create