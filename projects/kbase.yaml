apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  annotations:
    argocd-autopilot.argoproj-labs.io/default-dest-server: https://kubernetes.default.svc
    argocd.argoproj.io/sync-options: PruneLast=true
    argocd.argoproj.io/sync-wave: "-2"
  name: kbase
  namespace: argocd
spec:
  clusterResourceWhitelist:
  - group: '*'
    kind: '*'
  description: kbase project
  destinations:
  - namespace: '*'
    server: '*'
  namespaceResourceWhitelist:
  - group: '*'
    kind: '*'
  sourceRepos:
  - '*'
---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  name: kbase
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
  - git:
      repoURL: git@github.com:ststefa/argoauto-l5ug.git
      revision: "HEAD"
      files:
      - path: kbase/*/kustomization.yaml
  template:
    metadata:
      labels:
        app.kubernetes.io/managed-by: argocd-autopilot
        app.kubernetes.io/name: '{{ .path.basename }}'
      name: kbase-{{ .path.basename }}
      namespace: argocd
    spec:
      destination:
        server: "https://kubernetes.default.svc"
        #! The namespace must be set by the kbase component
        #namespace:
      project: kbase
      source:
        repoURL: git@github.com:ststefa/argoauto-l5ug.git
        targetRevision: "HEAD"
        path: "{{ .path.path }}"
      syncPolicy:
        automated:
          allowEmpty: true
          prune: true
          selfHeal: true
      ignoreDifferences:
      - group: argoproj.io
        jsonPointers:
        - /status
        kind: Application
