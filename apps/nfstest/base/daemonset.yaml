apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: nfstest
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: nfstest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfstest
    spec:
      tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
      initContainers:
        - name: verify-nfs-writes
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: POD_UID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.uid
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          command:
            - sh
            - -ec
            - |
              {
                echo "NFS smoke test"
                echo "timestamp=$(date -u +%FT%TZ)"
                echo "pod=${POD_NAME}"
                echo "namespace=${POD_NAMESPACE}"
                echo "pod_uid=${POD_UID}"
                echo "node=${NODE_NAME}"
              } | tee /srv/nfs-fast/nfs-smoke-test-${POD_NAME}.txt /srv/nfs-slow/nfs-smoke-test-${POD_NAME}.txt
              sync
          volumeMounts:
            - name: nfs-fast
              mountPath: /srv/nfs-fast
            - name: nfs-slow
              mountPath: /srv/nfs-slow
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:beta-slim
          env:
            - name: FILEBROWSER_CONFIG
              value: /config/config.yaml
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
            - name: nfs-fast
              mountPath: /srv/nfs-fast
            - name: nfs-slow
              mountPath: /srv/nfs-slow
      volumes:
        - name: config
          configMap:
            name: nfstest-filebrowser-config
        - name: nfs-fast
          persistentVolumeClaim:
            claimName: nfs-fast-rwx
        - name: nfs-slow
          persistentVolumeClaim:
            claimName: nfs-slow-rwx
