apiVersion: apps/v1
kind: Deployment
metadata:
  name: nfstest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: nfstest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nfstest
    spec:
      initContainers:
        - name: verify-nfs-writes
          image: busybox:1.36
          securityContext:
            runAsUser: 1000
            runAsGroup: 1000
          command:
            - sh
            - -ec
            - |
              date -u +%FT%TZ > /srv/nfs-fast/nfs-smoke-test.txt
              date -u +%FT%TZ > /srv/nfs-slow/nfs-smoke-test.txt
              sync
          volumeMounts:
            - name: nfs-fast
              mountPath: /srv/nfs-fast
            - name: nfs-slow
              mountPath: /srv/nfs-slow
      containers:
        - name: filebrowser
          image: gtstef/filebrowser:beta-slim
          ports:
            - name: http
              containerPort: 80
          volumeMounts:
            - name: nfs-fast
              mountPath: /srv/nfs-fast
            - name: nfs-slow
              mountPath: /srv/nfs-slow
      volumes:
        - name: nfs-fast
          persistentVolumeClaim:
            claimName: nfs-fast
        - name: nfs-slow
          persistentVolumeClaim:
            claimName: nfs-slow
