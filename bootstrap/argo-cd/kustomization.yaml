apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: argocd

#! Use ksops to decrypt secrets on the fly
generators:
  - |
    apiVersion: viaduct.ai/v1
    kind: ksops
    metadata:
      name: example-secret-generator
      annotations:
        config.kubernetes.io/function: |
            exec:
              # ksops must be reachable by $PATH
              path: ksops
    files:
    #! Clusters managed by this argocd
    - ./argocd-clusters.sops.yaml
    #! Credentials for repos used by argocd
    - ./argocd-repo-creds.sops.yaml
    #! The client secret used for OIDC
    - ./argocd-sso.sops.yaml

resources:
#! Original references argo-cd indirectly
#- github.com/argoproj-labs/argocd-autopilot/manifests/base?ref=v0.4.15
#! Reference argo-cd project directly. The "stable" tag always contains the latest version. This makes argo-cd auto-update itself
- https://raw.githubusercontent.com/argoproj/argo-cd/stable/manifests/install.yaml
#! The namespace
- argocd-ns.yaml
#! CRB to enable vault-authn
- argocd-repo-server-sa.yaml
#! Traefik ingressroute for Web access
- argocd-ingressroute.yaml

patches:
##! Pin workloads and amd64. Argo only has images for amd64 and arm64
##! This is no longer required. I accidentally used a 32bit k3s (armhf), leading to the node being "arm", not "arm64".
#- path: patches/arch-amd64.yaml
#  target:
#    labelSelector: app.kubernetes.io/part-of=argocd
#    kind: Deployment
#- path: patches/arch-amd64.yaml
#  target:
#    labelSelector: app.kubernetes.io/part-of=argocd
#    kind: StatefulSet
#! Argo OIDC config
- path: patches/argocd-cm-auth.yaml
#! Argo config tweaks
- path: patches/argocd-cm.yaml
#! Some tweaks
- path: patches/argocd-cmd-params-cm-patch.yaml
#! Enable ksops in argocd-repo-server
- path: patches/argocd-dep-ksops.yaml
#! Mount SA creds in argocd-repo-server
- path: patches/argocd-dep-sa.yaml
#! Enable vault access in argocd-repo-server
- path: patches/argocd-dep-vault.yaml
#! Groups and policies
- path: patches/argocd-rbac-cm.yaml
#! Trusted certs for remote repos and clusters
- path: patches/argocd-tls-certs-cm.yaml


configMapGenerator:
- name: argocd-cm
  behavior: merge
  literals:
  - |
    repository.credentials=- passwordSecret:
        key: git_token
        name: autopilot-secret
      url: https://github.com/
      usernameSecret:
        key: git_username
        name: autopilot-secret
