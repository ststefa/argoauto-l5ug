apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      initContainers:
        #! Generate initial OpenBao token. This has to happen in an initContainer because the file has to be present at the time it is mounted by the argocd-repo-server container. If the file is not present at that moment, then /custom-tools/.vault-token irreversibly becomes a directory, breaking the whole process!
        #! The initContainer is a friend because it prevents the old ReplicaSet from being discarded if something fails with vault. This is a safety net!
        - name: bao-token-init
          image: openbao/openbao:2
          command:
            - sh
            - -c
            - |
              set -eu
              date
              echo "Generating inital OpenBao token"
              bao write -field=token auth/kubernetes-l5ug/login \
                role=ksops-role \
                jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" \
                > /custom-tools/.vault-token
              echo Done
          env:
            - name: VAULT_ADDR
              value: "https://bao.heldenzeit.net"
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
      containers:
        #! Add a vault container for debugging
        - name: bao-cli
          image: openbao/openbao:2
          command: ["sleep", "infinity"]
          env:
            - name: VAULT_ADDR
              value: "https://bao.heldenzeit.net"
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
        #! Refresh token in intervals. It is crucial that the container does not fail because it will break the pod, which in turn breaks argocd. I.e., do not "set -e".
        #! Make sure that the token lifetime is longer than the loop interval
        - name: bao-token-refresher
          image: openbao/openbao:2
          env:
            - name: VAULT_ADDR
              value: "https://bao.heldenzeit.net"
          volumeMounts:
            - name: custom-tools
              mountPath: /custom-tools
          command:
            - sh
            - -c
            - |
              while true ; do
                date
                echo "Refreshing vault token..."
                bao write -field=token auth/kubernetes-l5ug/login role=ksops-role jwt="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)" > /custom-tools/.vault-token
                echo "done. Sleeping..."
                sleep 3300
              done
        - name: argocd-repo-server
          #! Set some env-vars to enable vault access
          #! These are no longer required because of vault-auth init container
          #env:
          #  - name: VAULT_ADDR
          #    value: "https://bao.heldenzeit.net"
          #  - name: VAULT_AUTH_METHOD
          #    value: "kubernetes"
          #  - name: VAULT_ROLE
          #    value: "ksops-role"
          volumeMounts:
            - name: custom-tools
              #! Kustomize/sops will automatically pick up the token from $HOME/.vault-token
              mountPath: /home/argocd/.vault-token
              subPath: .vault-token
