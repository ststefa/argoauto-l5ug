apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        #! Add a vault container for debugging
        - name: vault-cli
          image: hashicorp/vault:1.19.3
          command: ["sleep", "infinity"]
          env:
            - name: VAULT_ADDR
              value: "https://vault.heldenzeit.net"
        #! Set some env-vars to enable vault access
        - name: argocd-repo-server
          env:
            - name: VAULT_ADDR
              value: "https://vault.heldenzeit.net"
            - name: VAULT_AUTH_METHOD
              value: "kubernetes"
            - name: VAULT_ROLE
              value: "ksops-role"
