#! Set some env-vars to enable vault access
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      #! create a vault dir that is mounted by vault and argocd
      volumes:
        - name: vault
          emptyDir: {}
      containers:
        #! add a vault container for debugging
        - name: vault-cli
          image: hashicorp/vault:1.19.3
          command: ["sleep", "infinity"]
          volumeMounts:
            - name: vault
              mountPath: /vault
        - name: argocd-repo-server
          env:
            - name: VAULT_ADDR
              value: "https://vault.heldenzeit.net"
            - name: VAULT_AUTH_METHOD
              value: "kubernetes"
            - name: VAULT_ROLE
              value: "ksops-role"
        #! attach the vault container for debugging
          volumeMounts:
            - name: vault
              mountPath: /vault
