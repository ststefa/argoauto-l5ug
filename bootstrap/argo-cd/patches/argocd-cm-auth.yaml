apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  # Allow anon access?
  users.anonymous.enabled: "false"
  #! Users defined inside argocd, maybe useful for quick adhoc users
  #accounts.testuser: login # to check non-admin capabilities
  #
  #! A separate public CLI client is required because argocd CLI uses a local PKCE authorization-code flow.
  #! The regular confidential web client uses clientSecret and cannot be used by the CLI.
  oidc.config: |
    name: OpenBao
    issuer: https://bao.heldenzeit.net/v1/identity/oidc/provider/k8s
    clientID: tH3jslDrwkndgiqzeGzovWkgcbfdeyPu
    clientSecret: $argocd-sso:oidc.clientSecret
    cliClientID: 7vFA7yqp7PEY5x2yXgcQO2eqLAI8sDZE
    requestedIDTokenClaims:
       groups:
          essential: true
    requestedScopes:
       - openid
       - k8s
       - groups
