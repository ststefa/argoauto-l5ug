#! Overview - https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/
#! Example - https://argo-cd.readthedocs.io/en/stable/operator-manual/argocd-rbac-cm-yaml/
#! Testing - https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/#validating-and-testing-your-rbac-policies
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-rbac-cm
data:
  policy.csv: |
    # Self-defined argo roles
    ## argo_editor
    ### Regular "readonly" perms
    p, role:argo_editor, applications, get, */*, allow
    p, role:argo_editor, applicationsets, get, */*, allow
    p, role:argo_editor, certificates, get, *, allow
    p, role:argo_editor, clusters, get, *, allow
    p, role:argo_editor, projects, get, *, allow
    p, role:argo_editor, repositories, get, *, allow
    p, role:argo_editor, accounts, get, *, allow
    p, role:argo_editor, gpgkeys, get, *, allow
    ### And additionally
    #### sync apps
    p, role:argo_editor, applications, sync, */*, allow
    #### delete anything (https://argo-cd.readthedocs.io/en/stable/operator-manual/rbac/#fine-grained-permissions-for-updatedelete-action)
    #### <action>/<group>/<kind>/<ns>/<name>
    p, role:argo_editor, applications, delete/*/*/*/*, */*, allow
    #### get logs
    p, role:argo_editor, logs, get, */*, allow
    #### get logs
    p, role:argo_editor, exec, create, */*, allow
    # Map users
    g, "k8s_admin", role:admin
    g, "k8s_editor", role:argo_editor
    g, "k8s_viewer", role:readonly
  #policy.default: role:readonly
  scopes: '[groups, username]'